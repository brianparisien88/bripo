<style>
  :root{
    --ground:#FBFAF7; --surface:#FFFFFF; --surface2:#F4F2EC;
    --ink:#1A1D21; --ink-soft:#55605C; --ink-faint:#8A938E;
    --line:#E4E2DA; --line-soft:#EEEDE6;
    --accent:#0F7A5F; --accent-wash:#EAF2EE;
    --loss:#A83E2B; --loss-wash:#F6EAE6;
    --warn:#8A6410; --warn-wash:#F4EEDC;
    --shadow:0 1px 2px rgba(26,29,33,.04), 0 8px 28px -12px rgba(26,29,33,.10);
    --serif:"Fraunces",Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0F1417; --surface:#161C1F; --surface2:#212A28;
      --ink:#ECEAE2; --ink-soft:#93A09A; --ink-faint:#6B7772;
      --line:#26302D; --line-soft:#1E2623;
      --accent:#41C39B; --accent-wash:#15241F;
      --loss:#DB795F; --loss-wash:#2A1B17;
      --warn:#D9A85C; --warn-wash:#2A2114;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 34px -14px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:34px 22px 90px;}
  h1{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.015em;margin:0;}
  h2{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:30px 0 10px;}
  h3{font-family:var(--sans);font-size:11px;margin:20px 0 8px;color:var(--ink-soft);font-weight:700;
    text-transform:uppercase;letter-spacing:.09em;}
  .sub{color:var(--ink-soft);font-size:13px;}
  #appSubtitle{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--accent);
    text-transform:uppercase;letter-spacing:.14em;margin:0 0 7px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .spread{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:24px;max-width:390px;box-shadow:var(--shadow);}
  label{display:block;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.1em;margin:12px 0 5px;}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;font-family:var(--sans);}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input[type=checkbox]{width:auto;accent-color:var(--accent);}
  td select{min-width:7.5em;}
  textarea{min-height:56px;resize:vertical;}
  button{background:var(--accent);border:0;color:#fff;border-radius:8px;
    padding:8px 16px;font-size:13px;font-weight:500;font-family:var(--sans);cursor:pointer;}
  button.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  button.sm{padding:5px 10px;font-size:12px;}
  button:disabled{opacity:.5;cursor:default;}
  .msg{font-size:12px;color:var(--ink-soft);margin-top:10px;min-height:16px;}
  .msg.err{color:var(--loss);}
  .hide{display:none!important;}

  .langtoggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
  .langtoggle button{background:var(--surface);color:var(--ink-soft);border:0;border-radius:0;
    padding:5px 11px;font-family:var(--mono);font-size:11px;font-weight:500;}
  .langtoggle button.active{background:var(--accent-wash);color:var(--accent);}

  nav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:20px 0 8px;}
  nav button{background:none;color:var(--ink-soft);border:0;border-bottom:2px solid transparent;
    border-radius:0;padding:9px 12px;font-size:12.5px;font-family:var(--sans);}
  nav button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:500;}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:16px 0;}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
    box-shadow:var(--shadow);}
  .tile .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.11em;}
  .tile .v{font-family:var(--sans);font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;}

  .bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;margin:10px 0;}
  .bar > i{display:block;height:100%;background:var(--accent);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  thead th{border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-weight:500;font-size:9.5px;font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.1em;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);}
  tr.sub-row td{background:var(--surface2);color:var(--ink-soft);font-size:12px;}
  .tbl-scroll{overflow-x:auto;}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:500;
    font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;
    border:1px solid var(--line);white-space:nowrap;}
  .pill.green{color:var(--accent);background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 30%,transparent);}
  .pill.amber{color:var(--warn);background:var(--warn-wash);border-color:color-mix(in srgb,var(--warn) 30%,transparent);}
  .pill.red{color:var(--loss);background:var(--loss-wash);border-color:color-mix(in srgb,var(--loss) 30%,transparent);}
  .pill.dim{color:var(--ink-faint);}

  .flag{display:flex;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;
    margin:9px 0;background:var(--surface);box-shadow:var(--shadow);}
  .flag .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;}
  .flag.red{border-color:color-mix(in srgb,var(--loss) 40%,var(--line));} .flag.red .dot{background:var(--loss);}
  .flag.amber{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));} .flag.amber .dot{background:var(--warn);}
  .flag .t{font-weight:600;} .flag .d{color:var(--ink-soft);font-size:12px;}
  .flag.big{padding:16px 18px;background:var(--accent-wash);} .flag.big .t{font-size:15px;font-weight:700;}
  .flag.big.red{background:var(--loss-wash);}

  .placeholder{color:var(--ink-faint);border:1px dashed var(--line);border-radius:11px;
    padding:28px;text-align:center;}
  .inline-form{background:var(--surface2);border:1px solid var(--line);border-radius:11px;
    padding:16px;margin:12px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  .inline-form .full{grid-column:1/-1;}
  .inline-form label{margin-top:0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);
    border:1px solid var(--line);border-radius:9px;padding:10px 18px;font-size:13px;color:var(--ink);
    box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .toast.err{border-color:var(--loss);color:var(--loss);}
  .muted-cell{color:var(--ink-faint);}
  .ro-note{font-size:12px;color:var(--warn);margin-left:8px;}
</style>
</head>

<div class="wrap">
  <div class="spread">
    <div>
      <div id="appSubtitle">Altos de María construction dashboard</div>
      <h1>bripo</h1>
    </div>
    <div class="row" style="gap:14px;align-items:center;">

        <button id="logoutBtn" class="ghost sm">Sign out</button>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="login" class="card" style="margin-top:22px;">
    <label id="lblEmail">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label id="lblPassword">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px;">
      <button id="loginBtn">Sign in</button>
    </div>
    <div id="loginMsg" class="msg"></div>
    <div class="sub" id="loginNote" style="margin-top:14px;font-size:11px;"></div>
  </div>

  <!-- APP -->
  <div id="app" class="hide">
    <nav id="nav"></nav>
    <div id="view"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

 * bripo v1 dashboard — single file, vanilla JS, supabase-js + RLS.
 * The publishable key below is the anon role; every table's RLS policy
 * requires an allow-listed auth.uid() before a row is returned.
 * EN / ES via the t() helper + the header toggle (persisted per browser).
 * ------------------------------------------------------------------ */
const SUPABASE_URL = 'https://mxjoxxckekgtlvbmpkbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wmwbM7-UkcdcLOwg3AmUPQ_eDu-XwK8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $  = id => document.getElementById(id);
const h  = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) if (kid != null) n.append(kid.nodeType ? kid : String(kid));
  return n;
};

function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : (I18N.en[key] != null ? I18N.en[key] : key);
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(v);
  return s;
}
const stLabel = v => v == null ? '—' : t('st.' + v, {}) || String(v).replace(/_/g, ' ');
const advLabel = v => v ? t('adv.' + v) : '—';

const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const USD2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
const money  = n => n == null ? '—' : USD.format(Number(n));
const money2 = n => n == null ? '—' : USD2.format(Number(n));
const dateStr = d => d || '—';
const TODAY = new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.floor((new Date(b) - new Date(a)) / 86400000);

function toast(text, isErr) {
  const el = $('toast');
  el.textContent = text;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (el.className = 'toast'), 2600);
}

/* ---------------- state ---------------- */
const S = {
  isOwner: false, member: false, session: null, tab: 'overview',
  meta: null, milestones: [], payments: [], invoices: [], links: [],
  permits: [], decisions: [], changes: [], future: [], vendors: [], documents: [],
};

const TABLES = {
  contract_meta: 'meta', milestones: 'milestones', payments: 'payments',
  invoices: 'invoices', payment_invoice_links: 'links', permits: 'permits',
  decision_log: 'decisions', change_requests: 'changes',
  future_work_items: 'future', vendors: 'vendors', documents: 'documents',
};

async function loadAll() {
  const results = await Promise.all(Object.keys(TABLES).map(t => db.from(t).select('*')));
  Object.keys(TABLES).forEach((t, i) => {
    const { data, error } = results[i];
    if (error) { console.warn(t, error.message); return; }
    if (t === 'contract_meta') S.meta = data[0] || null;
    else S[TABLES[t]] = data || [];
  });
  S.milestones.sort((a, b) => a.seq - b.seq);
  S.permits.sort((a, b) => (a.seq ?? 99) - (b.seq ?? 99));
  S.payments.sort((a, b) => (a.date < b.date ? 1 : -1));
  S.invoices.sort((a, b) => (a.date_received < b.date_received ? 1 : -1));
  S.decisions.sort((a, b) => (a.date < b.date ? 1 : -1));
}

/* ---------------- writes ---------------- */
async function logActivity(entity, entity_id, action, detail) {
  try { await db.from('activity_log').insert({ entity, entity_id: String(entity_id ?? ''), action, detail }); }
  catch (e) {}
}
async function write(kind, table, arg, values, entityId) {
  let q;
  if (kind === 'insert') q = db.from(table).insert(values).select();
  else if (kind === 'update') q = db.from(table).update(values).match(arg).select();
  else if (kind === 'delete') q = db.from(table).delete().match(arg);
  const { data, error } = await q;
  if (error) { toast(error.message, true); return null; }
  await logActivity(table, entityId ?? (data && data[0] && (data[0].id ?? '')) ?? '', kind, values || arg);
  toast(t('common.saved'));
  await loadAll();
  render();
  return data;
}
const upd = (table, match, values, id) => write('update', table, match, values, id);
const ins = (table, values) => write('insert', table, null, values, null);
const del = (table, match, id) => { if (confirm(t('common.confirmDelete'))) return write('delete', table, match, null, id); };

/* ---------------- deterministic math ---------------- */
const contractPrice = () => Number(S.meta?.contract_price ?? 73500);

const advancesFor = mid =>
  S.payments.filter(p => p.milestone_id === mid && p.payment_type === 'material_advance')
    .reduce((s, p) => s + Number(p.amount), 0);
const disbursedFor = mid =>
  S.payments.filter(p => p.milestone_id === mid && p.payment_type === 'milestone_disbursement')
    .reduce((s, p) => s + Number(p.amount), 0);
const amountDue = m => Number(m.contract_amount) - advancesFor(m.id);
// running total of every payment recorded against a milestone (disbursements + advances)
const paidFor = mid => S.payments.filter(p => p.milestone_id === mid).reduce((s, p) => s + Number(p.amount), 0);

const paidToDate = () => S.payments.reduce((s, p) => s + Number(p.amount), 0);
const pctComplete = () =>
  S.milestones.filter(m => m.status === 'complete').reduce((s, m) => s + Number(m.contract_amount), 0)
  / contractPrice() * 100;

function scheduleStatus() {
  const h1 = S.meta?.h1_disbursement_date;
  const weeksAllowed = Number(S.meta?.weeks_allowed ?? 21);
  const perWeek = Number(S.meta?.delay_penalty_per_week ?? 250);
  const cap = Number(S.meta?.delay_penalty_cap ?? 7350);
  if (!h1) return { started: false, weeksAllowed };
  const weeksElapsed = Math.floor(daysBetween(h1, TODAY) / 7);
  const overWeeks = Math.max(0, weeksElapsed - weeksAllowed);
  const penalty = Math.min(overWeeks * perWeek, cap);
  const deadline = new Date(h1); deadline.setDate(deadline.getDate() + weeksAllowed * 7);
  return {
    started: true, h1, weeksElapsed, weeksAllowed, overWeeks, penalty, cap, perWeek,
    atCap: penalty >= cap && cap > 0, deadline: deadline.toISOString().slice(0, 10),
  };
}

const nextMilestone = () => S.milestones.find(m => m.status !== 'complete') || null;

const MILESTONE_PERMIT_GATES = { H1: [9], H2: [2, 3, 4], H6: [10] };

function attentionFlags() {
  const flags = [];
  const sc = scheduleStatus();

  if (sc.started && sc.penalty > 0) {
    flags.push({
      level: sc.atCap ? 'red' : 'amber', big: true,
      t: sc.atCap ? t('flag.delay.capTitle', { cap: money(sc.cap) })
                  : t('flag.delay.title', { penalty: money(sc.penalty) }),
      d: t('flag.delay.detail', {
        weeksElapsed: sc.weeksElapsed, h1: sc.h1, weeksAllowed: sc.weeksAllowed,
        overWeeks: sc.overWeeks, perWeek: money(sc.perWeek), cap: money(sc.cap),
      }),
    });
  }

  for (const p of S.payments.filter(p => p.payment_type === 'material_advance')) {
    const label = `${money(p.amount)} ${t('row.advance')}${p.advance_category ? ' (' + advLabel(p.advance_category) + ')' : ''} ${p.date}`;
    if (p.proof_of_purchase_deadline && p.proof_of_purchase_deadline < TODAY && !p.proof_of_purchase_received)
      flags.push({ level: 'red', t: t('flag.pop.overdueTitle', { label }),
        d: t('flag.pop.overdueDetail', { deadline: p.proof_of_purchase_deadline }) });
    else if (!p.proof_of_purchase_received)
      flags.push({ level: 'amber', t: t('flag.pop.pendingTitle', { label }),
        d: t('flag.pop.pendingDetail', { due: p.proof_of_purchase_deadline ? t('flag.pop.due', { deadline: p.proof_of_purchase_deadline }) : '' }) });
    if (!p.proof_of_delivery_received)
      flags.push({ level: 'amber', t: t('flag.pod.title', { label }), d: t('flag.pod.detail') });
  }

  const nm = nextMilestone();
  if (nm) {
    if (!nm.director_de_obra_approved)
      flags.push({ level: 'amber', t: t('flag.director.title', { m: nm.id }), d: t('flag.director.detail') });
    if (nm.seq >= 2 && !nm.paz_y_salvo_on_file)
      flags.push({ level: 'amber', t: t('flag.paz.title', { m: nm.id }), d: t('flag.paz.detail') });
    for (const pseq of (MILESTONE_PERMIT_GATES[nm.id] || [])) {
      const pm = S.permits.find(p => p.seq === pseq);
      if (pm && pm.status !== 'approved')
        flags.push({ level: 'amber', t: t('flag.permit.title', { m: nm.id, permit: pm.type }),
          d: t('flag.permit.detail', { status: stLabel(pm.status), m: nm.id }) });
    }
  }

  // bookkeeping drift between milestone status and recorded disbursements
  for (const m of S.milestones) {
    const disb = disbursedFor(m.id);
    if (m.status === 'complete' && disb === 0)
      flags.push({ level: 'amber', t: t('flag.drift.completeNoPay.title', { m: m.id }),
        d: t('flag.drift.completeNoPay.detail', { m: m.id }) });
    if (m.status !== 'complete' && disb > 0)
      flags.push({ level: 'amber', t: t('flag.drift.payNotComplete.title', { m: m.id }),
        d: t('flag.drift.payNotComplete.detail', { amount: money(disb), m: m.id, status: stLabel(m.status) }) });
  }

  if (S.meta?.final_delivery_date) {
    const fd = S.meta.final_delivery_date;
    const y = n => { const d = new Date(fd); d.setFullYear(d.getFullYear() + n); return d.toISOString().slice(0, 10); };
    flags.push({ level: 'amber', t: t('flag.warranty.title', { fd }),
      d: t('flag.warranty.detail', { y2: y(S.meta.warranty_labor_years), y10: y(S.meta.warranty_structural_years) }) });
  }

  return flags;
}

const STATUS_PILL = {
  not_started: 'dim', in_progress: 'amber', pending_inspection: 'amber', complete: 'green', delayed: 'red',
  submitted: 'amber', under_review: 'amber', approved: 'green',
  unmatched: 'dim', partially_matched: 'amber', matched: 'green',

};
const pill = v => h('span', { class: 'pill ' + (STATUS_PILL[v] || 'dim'), text: stLabel(v) });

function selectCell(value, options, onchange) {
  if (!S.isOwner) return pill(value);
  const sel = h('select', { onchange: e => onchange(e.target.value) });
  for (const o of options) sel.append(h('option', { value: o, ...(o === value ? { selected: true } : {}) }, stLabel(o)));
  return sel;

/* ---------------- tabs ---------------- */
const TABS = [
  'overview', 'milestones', 'budget', 'invoices', 'permits',
  'decisions', 'changes', 'future', 'vendors', 'documents',
];

function render() {
  const nav = $('nav'); nav.innerHTML = '';
  for (const id of TABS)
    nav.append(h('button', { class: id === S.tab ? 'active' : '', onclick: () => { S.tab = id; render(); } }, t('nav.' + id)));
  const v = $('view'); v.innerHTML = '';
  ({
    overview: viewOverview, milestones: viewMilestones, budget: viewBudget,
    invoices: viewInvoices, permits: viewPermits, decisions: viewDecisions,
    changes: viewChanges, future: viewFuture, vendors: viewVendors, documents: viewDocuments,

// Shared add-payment form. opts.milestoneId locks the payment to one milestone
// (used from the Milestones tab) and hides the milestone picker.
function buildPaymentForm(host, opts = {}) {
  const f = { payment_type: 'milestone_disbursement' };
  if (opts.milestoneId) f.milestone_id = opts.milestoneId;
  const bizDeadline = d => {
    const x = new Date(d); let n = 10;
    while (n > 0) { x.setDate(x.getDate() + 1); if (x.getDay() !== 0 && x.getDay() !== 6) n--; }
    return x.toISOString().slice(0, 10);
  };
  f.proof_of_purchase_deadline = bizDeadline(TODAY);
  const fields = [
    field(t('col.date'), h('input', { type: 'date', value: TODAY, onchange: e => f.date = e.target.value })),
    field(t('budget.form.amount'), h('input', { type: 'number', step: '0.01', onchange: e => f.amount = Number(e.target.value) })),
    field(t('budget.form.type'), h('select', { onchange: e => f.payment_type = e.target.value }, [
      h('option', { value: 'milestone_disbursement' }, t('budget.type.disb')),
      h('option', { value: 'material_advance' }, t('budget.type.adv')),
    ])),
  ];
  if (!opts.milestoneId) fields.push(
    field(t('col.milestone'), h('select', { onchange: e => f.milestone_id = e.target.value || null }, [
      h('option', { value: '' }, '—'), ...S.milestones.map(m => h('option', { value: m.id }, `${m.id} ${m.name}`)),
    ])));
  fields.push(
    field(t('col.recipient'), h('input', { type: 'text', onchange: e => f.recipient = e.target.value || null })),
    field(t('budget.form.method'), h('input', { type: 'text', placeholder: t('budget.form.methodPh'), onchange: e => f.method = e.target.value || null })),
    field(t('budget.form.advCat'), h('select', { onchange: e => f.advance_category = e.target.value || null }, [
      h('option', { value: '' }, t('budget.form.advCatPh')),
      ...['steel', 'huurre_panels', 'roof_structure', 'electrical_cable'].map(c => h('option', { value: c }, advLabel(c))),
    ])),
    field(t('budget.form.popDeadline'), h('input', { type: 'date', value: f.proof_of_purchase_deadline,
      onchange: e => f.proof_of_purchase_deadline = e.target.value || null })),
    h('div', { class: 'full' }, [h('label', {}, t('col.notes')), h('textarea', { onchange: e => f.notes = e.target.value || null })]),
    h('div', { class: 'full row' }, [
      h('button', { onclick: async () => {
        if (!f.date || !f.amount || !f.payment_type) { toast(t('budget.toast.paymentReq'), true); return; }
        if (await ins('payments', f)) host.innerHTML = '';
      } }, t('budget.form.savePayment')),
      h('button', { class: 'ghost', onclick: () => host.innerHTML = '' }, t('common.cancel')),
      h('span', { class: 'sub', text: t('budget.form.paymentHint') }),
    ]));
  host.append(h('div', { class: 'inline-form' }, fields));
}

/* ---------------- Decision log ---------------- */
function viewDecisions(v) {
  v.append(h('div', { class: 'spread' }, [h('h2', {}, t('decisions.heading')),
    ownerOnly(h('button', { class: 'sm', onclick: () => toggleForm('decisionForm', decisionForm) }, t('decisions.add')))]));
  v.append(h('div', { class: 'sub', text: t('decisions.sub') }));
  v.append(h('div', { id: 'decisionForm' }));
  const unconfirmed = S.decisions.filter(d => !d.confirmed);
  if (unconfirmed.length) {
    v.append(h('h3', {}, t('decisions.awaiting', { n: unconfirmed.length })));
    v.append(decisionTable(unconfirmed));
  }
  v.append(h('h3', {}, t('decisions.confirmed')));
  v.append(decisionTable(S.decisions.filter(d => d.confirmed)));
}
function decisionTable(rows) {
  if (!rows.length) return h('div', { class: 'placeholder', text: t('decisions.nothing') });
  return h('div', { class: 'tbl-scroll' }, h('table', {}, [
    h('thead', {}, h('tr', {}, [t('col.date'), t('col.source'), t('col.party'), t('col.summary'), t('col.resolves'), t('col.confirmed'), ''].map(x => h('th', {}, x)))),
    h('tbody', {}, rows.map(d => h('tr', {}, [
      h('td', {}, d.date),
      h('td', {}, t('source.' + d.source, {}) || d.source),
      h('td', {}, d.party || '—'),
      h('td', {}, d.summary),
      h('td', {}, d.resolves || '—'),
      h('td', {}, checkCell(d.confirmed, val => upd('decision_log', { id: d.id }, { confirmed: val }, d.id))),
      h('td', {}, ownerOnly(h('button', { class: 'ghost sm', onclick: () => del('decision_log', { id: d.id }, d.id) }, '×'))),
    ]))),
  ]));
}
function decisionForm(host) {
  const f = { source: 'whatsapp', confirmed: false };
  host.append(h('div', { class: 'inline-form' }, [
    field(t('col.date'), h('input', { type: 'date', value: TODAY, onchange: e => f.date = e.target.value })),
    field(t('col.source'), h('select', { onchange: e => f.source = e.target.value }, ['whatsapp', 'email', 'manual', 'other'].map(s => h('option', { value: s }, t('source.' + s))))),
    field(t('col.party'), h('input', { type: 'text', placeholder: t('decisions.form.partyPh'), onchange: e => f.party = e.target.value || null })),
    field(t('col.resolves'), h('input', { type: 'text', placeholder: t('decisions.form.resolvesPh'), onchange: e => f.resolves = e.target.value || null })),
    h('div', { class: 'full' }, [h('label', {}, t('decisions.form.summaryLabel')), h('textarea', { onchange: e => f.summary = e.target.value })]),
    h('div', { class: 'full row' }, [
      h('label', { style: 'margin:0' }, [h('input', { type: 'checkbox', onchange: e => f.confirmed = e.target.checked }), ' ' + t('decisions.form.confirmedLabel')]),
      h('button', { onclick: async () => {
        if (!f.date || !f.summary) { toast(t('decisions.toast.req'), true); return; }
        await ins('decision_log', f);
      } }, t('decisions.form.saveEntry')),
      h('button', { class: 'ghost', onclick: () => host.innerHTML = '' }, t('common.cancel')),
    ]),
  ]));
}

/* ---------------- Documents ---------------- */
function viewDocuments(v) {
  v.append(h('h2', {}, t('documents.heading')));
  v.append(h('div', { class: 'sub', text: t('documents.sub') }));
  if (S.isOwner) {
    const f = {};
    v.append(h('div', { class: 'inline-form' }, [
      field(t('documents.form.file'), h('input', { type: 'file', onchange: e => f.file = e.target.files[0] })),
      field(t('documents.form.linkedTo'), h('select', { onchange: e => f.linked_entity_type = e.target.value || null }, [
        h('option', { value: '' }, '—'), ...['milestone', 'permit', 'payment', 'invoice', 'vendor', 'change_request'].map(x => h('option', { value: x }, t('ent.' + x))),
      ])),
      field(t('documents.form.entityId'), h('input', { type: 'text', placeholder: t('documents.form.entityIdPh'), onchange: e => f.linked_entity_id = e.target.value || null })),
      h('div', { class: 'row' }, h('button', { onclick: () => uploadDoc(f) }, t('documents.form.upload'))),
    ]));
  }
  v.append(h('div', { class: 'tbl-scroll' }, h('table', {}, [
    h('thead', {}, h('tr', {}, [t('col.filename'), t('col.linked'), t('col.uploaded'), ''].map(x => h('th', {}, x)))),
    h('tbody', {}, S.documents.map(d => h('tr', {}, [
      h('td', {}, S.isOwner ? h('a', { href: '#', onclick: async ev => { ev.preventDefault(); await openDoc(d); } }, d.filename) : d.filename),
      h('td', {}, d.linked_entity_type ? `${t('ent.' + d.linked_entity_type, {}) || d.linked_entity_type} ${d.linked_entity_id || ''}` : '—'),
      h('td', {}, (d.uploaded_at || '').slice(0, 10)),
      h('td', {}, ownerOnly(h('button', { class: 'ghost sm', onclick: () => del('documents', { id: d.id }, d.id) }, '×'))),
    ]))),
  ])));
}
async function uploadDoc(f) {
  if (!f.file) { toast(t('documents.toast.chooseFile'), true); return; }
  const path = `${Date.now()}_${f.file.name}`.replace(/[^\w.\-]/g, '_');
  const { error } = await db.storage.from('documents').upload(path, f.file);
  if (error) { toast('Upload: ' + error.message, true); return; }
  await ins('documents', { filename: f.file.name, storage_path: path, linked_entity_type: f.linked_entity_type, linked_entity_id: f.linked_entity_id });
}
async function openDoc(d) {
  const { data, error } = await db.storage.from('documents').createSignedUrl(d.storage_path, 120);
  if (error) { toast(error.message, true); return; }
  window.open(data.signedUrl, '_blank');
}

/* ---------------- form toggle helper ---------------- */
function toggleForm(hostId, builder) {
  const host = $(hostId);
  if (host.children.length) { host.innerHTML = ''; return; }
  builder(host);
}

/* ---------------- static text + language ---------------- */
function applyStaticText() {
  document.documentElement.lang = LANG;
  $('appSubtitle').textContent = t('app.subtitle');
  $('lblEmail').textContent = t('login.email');
  $('lblPassword').textContent = t('login.password');
  $('loginBtn').textContent = t('login.signin');
  $('loginNote').textContent = t('login.note');
  $('logoutBtn').textContent = t('app.signout');
}
function renderLang() {
  const box = $('langToggle'); box.innerHTML = '';
  for (const l of ['en', 'es'])
    box.append(h('button', { class: l === LANG ? 'active' : '', onclick: () => setLang(l) }, l.toUpperCase()));
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('bripo_lang', l); } catch (e) {}
  renderLang();
  applyStaticText();
  renderWho();
  if (S.session && S.member) render();
  else if (S.session && !S.member) renderNotMember();
}
function renderWho() {
  if (!S.session) return;
  const roleTxt = !S.member ? t('role.none') : (S.isOwner ? t('role.owner') : t('role.viewer'));
  $('who').textContent = S.session.user.email + ' · ' + roleTxt;
}
function renderNotMember() {
  $('nav').innerHTML = '';
  $('view').innerHTML = '';
  $('view').append(h('div', { class: 'placeholder', html:
    t('login.notmember', { email: S.session.user.email }) + '<br>' + t('login.notmember2')
    + `<br><code>insert into app_users (user_id, email, role) values ('${S.session.user.id}', '${S.session.user.email}', 'owner');</code>` }));
}

/* ---------------- auth ---------------- */
async function refresh() {
  const { data: { session } } = await db.auth.getSession();
  S.session = session;
  const authed = !!session;
  $('login').classList.toggle('hide', authed);
  $('app').classList.toggle('hide', !authed);
  $('sessionBox').classList.toggle('hide', !authed);
  if (!authed) return;

  let member = false;
  try { const { data } = await db.rpc('is_member'); member = !!data; } catch (e) {}
  try { const { data } = await db.rpc('is_owner'); S.isOwner = !!data; } catch (e) { S.isOwner = false; }
  S.member = member;
  renderWho();

  if (!member) { renderNotMember(); return; }
  await loadAll();
  render();
}

$('loginBtn').addEventListener('click', async () => {
  const m = $('loginMsg'); m.textContent = t('login.signingin'); m.classList.remove('err');
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { m.textContent = error.message; m.classList.add('err'); return; }
  m.textContent = '';
});
// No self-signup. Accounts are created by the owner in the Supabase dashboard
// (Authentication → Add user) and then allow-listed in app_users.
$('logoutBtn').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });
db.auth.onAuthStateChange(() => refresh());

renderLang();
applyStaticText();
refresh();
</script>
