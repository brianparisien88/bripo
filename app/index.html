<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>bripo</title>
<style>
  :root{
    --bg:#0e0f11; --surface:#16181c; --surface2:#1d2025; --border:#282c33;
    --text:#e6e7e9; --muted:#9aa0a8; --dim:#6b7076; --accent:#4a9eff;
    --green:#3fb950; --red:#e5534b; --amber:#d4a72c;
    --mono:'SF Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:20px;margin:0 0 2px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:22px;max-width:380px;}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:9px 11px;font-size:14px;outline:none;}
  button{margin-top:16px;background:var(--accent);border:0;color:#fff;border-radius:6px;
    padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;}
  .msg{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;}
  .msg.err{color:var(--red);}
  .hide{display:none;}
  .placeholder{color:var(--dim);border:1px dashed var(--border);border-radius:10px;
    padding:40px;text-align:center;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>bripo</h1>
  <div class="sub">Altos de Maria construction dashboard</div>

  <!-- LOGIN -->
  <div id="login" class="card">
    <label>Email</label>
    <input id="email" type="email" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- APP (after auth) -->
  <div id="app" class="hide">
    <div class="sub" id="who"></div>
    <button id="logoutBtn" style="background:var(--surface2);color:var(--text);
      border:1px solid var(--border);margin:0;">Sign out</button>
    <div class="placeholder">
      Dashboard modules not built yet.<br>
      Next session: build v1 per <code>docs/CHARTER.md</code>.
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Publishable key = anon role, RLS applies. Safe to ship. No data is baked in;
  // every table requires an allow-listed auth.uid() before returning a row.
  const SUPABASE_URL = 'https://mxjoxxckekgtlvbmpkbd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_wmwbM7-UkcdcLOwg3AmUPQ_eDu-XwK8';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);

  async function render(){
    const { data:{ session } } = await db.auth.getSession();
    const authed = !!session;
    $('login').classList.toggle('hide', authed);
    $('app').classList.toggle('hide', !authed);
    if(authed){
      let member = false;
      try {
        const { data } = await db.rpc('is_member');
        member = !!data;
      } catch(e){}
      $('who').textContent = session.user.email
        + (member ? '' : '  —  not on the allow-list (ask the owner to add you)');
    }
  }

  $('loginBtn').addEventListener('click', async ()=>{
    const m = $('loginMsg'); m.textContent = 'Signing in…'; m.classList.remove('err');
    const { error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(), password: $('password').value,
    });
    if(error){ m.textContent = error.message; m.classList.add('err'); return; }
    m.textContent = ''; render();
  });
  $('logoutBtn').addEventListener('click', async ()=>{ await db.auth.signOut(); render(); });
  db.auth.onAuthStateChange(()=>render());
  render();
</script>
</body>
</html>
