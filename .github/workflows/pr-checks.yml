name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Schema snapshot is current
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL var not set — skipping"; exit 0; fi
          pip install -q -r tools/requirements.txt
          python tools/schema_snapshot.py
          if ! git diff --quiet -- docs/schema-snapshot.json; then
            echo "::error::docs/schema-snapshot.json is stale. Run 'python tools/schema_snapshot.py' and commit it, then update CLAUDE.md."
            git --no-pager diff -- docs/schema-snapshot.json
            exit 1
          fi

      - name: Flag unguarded destructive operations
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          risky="$(git diff "$base".."$head" -- '*.py' '*.sql' '*.ts' '*.html' \
                   | grep -E '^\+' | grep -viE '^\+\s*(#|//|--)' \
                   | grep -iE 'DROP TABLE|TRUNCATE|DELETE FROM|\.delete\(|requests\.delete' || true)"
          if [ -n "$risky" ]; then
            echo "::warning::PR adds destructive DB/data operations — confirm each is guarded:"
            printf '%s\n' "$risky"
          else
            echo "no new destructive operations in this diff"
          fi
